<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Wavesurfer Annotator</title>
  <!-- Load Wavesurfer and Regions Plugin from unpkg CDN -->
  <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
  <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
  <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/timeline.min.js"></script>
  <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/hover.min.js"></script>
  <!-- Load Tribute for textarea autocomplete -->
  <link rel="stylesheet" href="https://unpkg.com/tributejs@5.1.3/dist/tribute.css">
  <script src="https://unpkg.com/tributejs@5.1.3/dist/tribute.min.js"></script>
  <!-- Load FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #5b46b0;
      --bg-color: #f7f7fa;
      --panel-bg: #ffffff;
      --border-color: #e0e0e0;
      --text-color: #333333;
      --segment-bg: #f8f9ff;
      --segment-border: #d0c8f0;
      --active-segment-bg: #e6f0ff;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow: hidden; /* Prevent body scroll, handle scroll in segments */
    }

    .container {
      display: flex;
      flex-direction: row;
      height: 85vh; /* Adjusted to fit nicely in iframe */
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      background: var(--panel-bg);
    }

    /* LEFT PANE: Audio Player */
    .left-pane {
      flex: 1.2;
      min-width: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-color);
      padding: 20px;
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .player-controls {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #f1f3f4;
      padding: 10px 20px;
      border-radius: 30px;
    }
    
    .btn-play {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--primary-color);
    }

    .time-display {
      font-family: monospace;
      font-size: 14px;
    }

    .sliders {
      display: flex;
      gap: 20px;
      margin-top: auto; /* Push waveform to bottom */
      margin-bottom: 20px;
      font-size: 13px;
      color: #666;
    }

    .waveform-container {
      position: relative;
      width: 100%;
      height: 150px;
      background: #fdfdfd;
      border: 1px solid #eee;
      border-radius: 4px;
    }

    .right-pane {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg-color);
    }

    .segments-header {
      background: #e6e3f5;
      padding: 12px;
      text-align: center;
      font-weight: 600;
      color: var(--primary-color);
      border-bottom: 1px solid var(--border-color);
    }

    .segments-list {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .segment-item {
      background: var(--panel-bg);
      border: 1px solid var(--segment-border);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: all 0.2s;
    }

    .segment-item.active {
      border-color: #2196F3;
      box-shadow: 0 0 0 2px rgba(33, 150, 243, 0.2);
    }

    .segment-header-bar {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      background: var(--segment-bg);
      border-bottom: 1px solid var(--segment-border);
      gap: 10px;
    }
    
    .segment-item.active .segment-header-bar {
      background: var(--active-segment-bg);
      border-bottom-color: #b3d4ff;
    }

    .segment-id {
      background: var(--primary-color);
      color: white;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }

    .time-input {
      background: #666;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      text-align: center;
      width: 70px;
    }

    .speaker-select {
      flex: 1;
      padding: 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }

    .segment-body {
      padding: 12px;
      display: flex;
      gap: 15px;
    }

    .segment-half {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .segment-half-title {
      font-size: 11px;
      color: #777;
      margin-bottom: 5px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .text-area {
      width: 100%;
      height: 80px;
      border: 1px solid transparent;
      resize: vertical;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
    }
    
    .text-area:focus {
      border-color: var(--border-color);
    }

    .text-area.readonly {
      background: #f5f5f5;
      color: #555;
      cursor: not-allowed;
    }

    .rich-preview {
      width: 100%;
      height: 80px;
      padding: 8px;
      overflow-y: auto;
      background: #fdfdfd;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
      line-height: 1.8;
      cursor: default;
    }
    
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 0 6px;
      border-radius: 4px;
      margin: 0 3px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid;
      cursor: help;
    }
    .chip-hesitation { background: #fff8e1; border-color: #ffe082; color: #f57f17; }
    .chip-paralinguistic { background: #e8f5e9; border-color: #a5d6a7; color: #2e7d32; }
    .chip-other { background: #e3f2fd; border-color: #90caf9; color: #1565c0; }
    .chip-speaker { background: #ede7f6; border-color: #d1c4e9; color: #4527a0; }
    .chip-bracket { background: #e0f7fa; border-color: #80deea; color: #00838f; }
    .chip-language { background: #fce4ec; border-color: #f48fb1; color: #c2185b; }
    .chip-icon { margin-right: 4px; font-size: 10px; }
    
    .chip-error {
      background: #ffebee;
      border-color: #ffcdd2;
      color: #d32f2f;
      border-style: dashed;
    }
    
    .speaker-label {
      font-size: 10px;
      color: #7e57c2;
      font-weight: bold;
      margin-top: 8px;
      margin-bottom: 4px;
      border: 1px solid #d1c4e9;
      display: block;
      width: fit-content;
      padding: 2px 6px;
      border-radius: 4px;
      background: #f3e5f5;
    }
    
    .error-box {
      color: #d32f2f;
      font-size: 12px;
      margin-top: 5px;
      display: none;
    }

    /* Loader */
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <div class="left-pane">
      <div class="player-header">
        <h3 id="taskTitle" style="margin:0; color: #444; font-weight: 500;">Task #</h3>
        <button onclick="sendSaveEvent()" style="background:var(--primary-color); color:white; border:none; padding:8px 16px; border-radius:4px; cursor:pointer;">Save Draft</button>
      </div>

      <div class="player-controls">
        <button class="btn-play" id="prevBtn" onclick="sendAction('prev_task')" title="Previous Task"><i class="fas fa-step-backward"></i></button>
        <button class="btn-play" id="playBtn" onclick="togglePlay()"><i class="fas fa-play"></i></button>
        <button class="btn-play" id="nextBtn" onclick="sendAction('next_task')" title="Next Task"><i class="fas fa-step-forward"></i></button>
        <div class="time-display" id="timeDisplay">00:00 / 00:00</div>
      </div>
      
      <div style="flex:1;"></div>

      <div class="sliders">
        <label>
          Playback Speed: <span id="speedVal">1.0</span>x
          <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="1" oninput="setSpeed(this.value)">
        </label>
        <label>
          Timeline Scale:
          <input type="range" id="zoomSlider" min="10" max="100" step="1" value="10" oninput="setZoom(this.value)">
        </label>
      </div>

      <div class="waveform-container" id="waveform">
        <div id="loading">Loading audio...</div>
      </div>
      <div id="timeline" style="margin-top: 5px; font-family: monospace; font-size: 11px; color: #666;"></div>
    </div>

    <div class="right-pane">
      <div class="segments-header">RSML Transcription</div>
      <div class="segments-list" id="segmentsList">
        <!-- Segments will be injected here -->
      </div>
    </div>
  </div>

  <script>
    let wavesurfer = null;
    let wsRegions = null;
    let currentSegments = [];
    let activeSegmentId = null;
    let audioReady = false;
    let playingRegionEnd = null; // Track if we are playing a specific region

    const rsmlTags = [
        "breathe", "broken-word-end", "broken-word-start", "cough", "cry",
        "crying-end", "crying-start", "eating-sounds", "ehh", "emphasis-end", 
        "emphasis-start", "falling-pitch-end", "falling-pitch-start", "false-start-end", "false-start-start", 
        "filler-end", "filler-start", "groan", "hmm", "huh",
        "hum", "humming-end", "humming-start", "laughing-end", "laughing-start",
        "laughter", "nose-blowing", "prolongation-end", "prolongation-start", "raising-pitch-end",
        "raising-pitch-start", "repair-end", "repair-start", "repetition-end", "repetition-start",
        "sigh", "silence", "singing-end", "singing-start", "sneeze",
        "sniff", "snore", "stutter-block", "throat-clearing", "tsk",
        "ugh", "uh-huh", "uhh", "umm", "unintelligible",
        "whispering-end", "whispering-start", "whistling-end", "whistling-start", "yawn", 
        "yelling-end", "yelling-start"
    ];

    let tribute = new Tribute({
        values: rsmlTags.map(tag => ({key: tag, value: tag})),
        selectTemplate: function (item) {
            return '@' + item.original.value;
        },
        requireLeadingSpace: false,
        noMatchTemplate: function () {
            return '<span style:"visibility: hidden;"></span>';
        }
    });

    // ----- Streamlit Component API -----
    function sendValue(value) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value: value,
      }, "*");
    }

    function setFrameHeight(height) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: height,
      }, "*");
    }

    function formatTime(seconds) {
      if (isNaN(seconds)) return "00:00.000";
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      const ms = Math.floor((seconds % 1) * 1000);
      
      let res = "";
      if (h > 0) res += h.toString().padStart(2, '0') + ":";
      res += m.toString().padStart(2, '0') + ":" + s.toString().padStart(2, '0');
      res += "." + ms.toString().padStart(3, '0');
      return res;
    }

    function initWavesurfer(audioUrl) {
      if (wavesurfer) {
        wavesurfer.destroy();
      }

      wavesurfer = WaveSurfer.create({
        container: '#waveform',
        waveColor: '#b4ebd3',
        progressColor: '#1bb572',
        cursorColor: '#ff5722',
        barWidth: 2,
        barGap: 1,
        barRadius: 2,
        height: 150,
        normalize: true,
        minPxPerSec: 10
      });

      wsRegions = wavesurfer.registerPlugin(WaveSurfer.Regions.create());
      
      wavesurfer.registerPlugin(WaveSurfer.Timeline.create({
        container: '#timeline',
        height: 20,
        timeInterval: 1,
        primaryLabelInterval: 5,
        secondaryLabelInterval: 1,
        formatTimeCallback: (sec) => formatTime(sec)
      }));

      wavesurfer.registerPlugin(WaveSurfer.Hover.create({
        lineColor: '#ff0000',
        lineWidth: 2,
        labelBackground: '#222',
        labelColor: '#fff',
        labelSize: '12px',
      }));

      wavesurfer.on('ready', () => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('timeDisplay').innerText = `00:00 / ${formatTime(wavesurfer.getDuration())}`;
        audioReady = true;
        
        // If segments were provided before ready, render them now
        if (currentSegments.length > 0) {
            renderSegments();
        } else {
            // Default empty segment if none
            currentSegments = [{
                id: 1,
                start: 0,
                end: Math.min(wavesurfer.getDuration(), 5),
                speaker: "Speaker 0 (Female)",
                text: ""
            }];
            renderSegments();
        }
      });

      wavesurfer.on('audioprocess', (time) => {
        document.getElementById('timeDisplay').innerText = `${formatTime(time)} / ${formatTime(wavesurfer.getDuration())}`;
        // Pause if we reached the end of a playing region
        if (playingRegionEnd !== null && time >= playingRegionEnd) {
            wavesurfer.pause();
            playingRegionEnd = null;
        }
      });
      
      wavesurfer.on('seek', (time) => {
         document.getElementById('timeDisplay').innerText = `${formatTime(wavesurfer.getCurrentTime())} / ${formatTime(wavesurfer.getDuration())}`;
         playingRegionEnd = null; // clear region bounds on manual seek
      });

      wavesurfer.on('play', () => {
        document.getElementById('playBtn').innerHTML = '<i class="fas fa-pause"></i>';
      });

      wavesurfer.on('pause', () => {
        document.getElementById('playBtn').innerHTML = '<i class="fas fa-play"></i>';
      });

      wsRegions.on('region-clicked', (region, e) => {
        e.stopPropagation();
        activateSegment(region.id);
        playingRegionEnd = region.end;
        region.play();
      });
      
      wsRegions.on('region-updated', (region) => {
         // Update segment list data
         const seg = currentSegments.find(s => s.id == region.id);
         if (seg) {
             seg.start = region.start;
             seg.end = region.end;
             updateSegmentUI(seg.id);
         }
      });

      wavesurfer.load(audioUrl);
    }

    function togglePlay() {
      if (wavesurfer) wavesurfer.playPause();
    }

    function setSpeed(val) {
      document.getElementById('speedVal').innerText = parseFloat(val).toFixed(1);
      if (wavesurfer) wavesurfer.setPlaybackRate(val);
    }

    function setZoom(val) {
      if (wavesurfer) wavesurfer.zoom(Number(val));
    }

    function renderSegments() {
      wsRegions.clearRegions();
      const listEl = document.getElementById('segmentsList');
      listEl.innerHTML = '';

      currentSegments.forEach((seg, index) => {
        // Add text label to region
        const contentEl = document.createElement('div');
        contentEl.textContent = seg.text;
        contentEl.id = `region-text-${seg.id}`;
        contentEl.style.padding = '2px 4px';
        contentEl.style.fontSize = '10px';
        contentEl.style.color = '#333';
        contentEl.style.whiteSpace = 'nowrap';
        contentEl.style.overflow = 'hidden';
        contentEl.style.textOverflow = 'ellipsis';
        contentEl.style.pointerEvents = 'none'; // so it doesn't block dragging

        // Add region to waveform
        wsRegions.addRegion({
          id: seg.id,
          start: seg.start,
          end: seg.end,
          color: 'rgba(91, 70, 176, 0.2)',
          content: contentEl,
          drag: true,
          resize: true
        });

        // Add to list
        const item = document.createElement('div');
        item.className = 'segment-item';
        item.id = `seg-${seg.id}`;
        item.onclick = () => activateSegment(seg.id, true);


        item.innerHTML = `
          <div class="segment-header-bar">
            <div class="segment-id">${index + 1}</div>
            <input type="text" class="time-input" id="start-${seg.id}" value="${formatTime(seg.start)}" readonly>
            <select class="speaker-select" id="speaker-${seg.id}" onchange="updateData(${seg.id})">
              <option value="Speaker 0 (Female)" ${seg.speaker === 'Speaker 0 (Female)' ? 'selected' : ''}>Speaker 0 (Female)</option>
              <option value="Speaker 1 (Male)" ${seg.speaker === 'Speaker 1 (Male)' ? 'selected' : ''}>Speaker 1 (Male)</option>
              <option value="Speaker 2 (Female)" ${seg.speaker === 'Speaker 2 (Female)' ? 'selected' : ''}>Speaker 2 (Female)</option>
            </select>
            <input type="text" class="time-input" id="end-${seg.id}" value="${formatTime(seg.end)}" readonly>
          </div>
          <div class="segment-body">
            <div class="segment-half">
              <div class="segment-half-title">Editable ASR Transcript</div>
              <textarea class="text-area" id="text-${seg.id}" onchange="updateData(${seg.id})" oninput="updateNormalizedPreview(${seg.id})" onclick="event.stopPropagation()">${seg.text}</textarea>
              <div id="error-${seg.id}" class="error-box"></div>
            </div>
            <div class="segment-half">
              <div class="segment-half-title">Normalized Preview</div>
              <div class="rich-preview" id="rich-preview-${seg.id}"></div>
            </div>
          </div>
        `;
        listEl.appendChild(item);
      });

      // Attach Tribute to all new textareas
      tribute.attach(document.querySelectorAll('.text-area'));
      
      // Initialize preview and validation for all segments
      currentSegments.forEach(seg => updateNormalizedPreview(seg.id));
    }
    
    function updateSegmentUI(id) {
        const seg = currentSegments.find(s => s.id == id);
        if (seg) {
            document.getElementById(`start-${id}`).value = formatTime(seg.start);
            document.getElementById(`end-${id}`).value = formatTime(seg.end);
        }
    }

    function activateSegment(id, seek = false) {
      if (activeSegmentId) {
        const oldEl = document.getElementById(`seg-${activeSegmentId}`);
        if (oldEl) oldEl.classList.remove('active');
      }
      activeSegmentId = id;
      const el = document.getElementById(`seg-${id}`);
      if (el) {
        el.classList.add('active');
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      if (seek && wavesurfer) {
        const seg = currentSegments.find(s => s.id === id);
        if (seg) {
          const duration = wavesurfer.getDuration();
          if (duration > 0) {
            wavesurfer.seekTo(seg.start / duration);
          }
        }
      }
    }

    function updateData(id) {
      const seg = currentSegments.find(s => s.id === id);
      if (seg) {
        seg.speaker = document.getElementById(`speaker-${id}`).value;
        seg.text = document.getElementById(`text-${id}`).value;
        sendSaveEvent();
      }
    }

    function getTagCategory(tag) {
        const hesitations = ['umm','uhh','hmm','ugh','huh','tsk','uh-huh','ehh'];
        const paralinguistics = ['laughter','cry','hum','breathe','sniff','nose-blowing','cough','sneeze','throat-clearing','yawn','eating-sounds','snore','groan','sigh'];
        const otherIsolated = ['silence','unintelligible','stutter-block'];
        
        if (hesitations.includes(tag)) return { cat: 'Hesitation', cls: 'chip-hesitation' };
        if (paralinguistics.includes(tag)) return { cat: 'Paralinguistic', cls: 'chip-paralinguistic' };
        if (otherIsolated.includes(tag)) return { cat: 'Other', cls: 'chip-other' };
        if (tag.includes('start') || tag.includes('end')) {
            if (tag.startsWith('s')) return { cat: 'Speaker Turn', cls: 'chip-speaker' };
            return { cat: 'Span Tag', cls: 'chip-paralinguistic' };
        }
        return { cat: 'Unknown Tag', cls: 'chip-other' };
    }

    function processRSML(text) {
        let errors = [];
        const tagRegex = /([&@][a-zA-Z0-9_-]+-(?:start|end)|@[a-zA-Z0-9_-]+|#[a-zA-Z0-9_-]+(?::[a-zA-Z0-9_-]+)?\[.*?\]\(.*?\)|![a-zA-Z0-9_-]+\[.*?\]\(.*?\))/g;
        
        let tokens = [];
        let lastIndex = 0;
        let match;
        
        while ((match = tagRegex.exec(text)) !== null) {
            if (match.index > lastIndex) {
                tokens.push({ type: 'text', value: text.substring(lastIndex, match.index) });
            }
            tokens.push({ type: 'tag', value: match[0] });
            lastIndex = tagRegex.lastIndex;
        }
        if (lastIndex < text.length) {
            tokens.push({ type: 'text', value: text.substring(lastIndex) });
        }
        
        let openStack = [];
        let errorTokens = new Set();
        
        for (let i = 0; i < tokens.length; i++) {
            let t = tokens[i];
            if (t.type === 'tag') {
                if (t.value.endsWith('-start')) {
                    let base = t.value.substring(1, t.value.length - 6);
                    openStack.push({ base: base, index: i, value: t.value });
                } else if (t.value.endsWith('-end')) {
                    let base = t.value.substring(1, t.value.length - 4);
                    if (openStack.length > 0 && openStack[openStack.length - 1].base === base) {
                        openStack.pop();
                    } else {
                        errorTokens.add(i);
                        errors.push(`Unmatched ${t.value}`);
                    }
                }
            }
        }
        
        openStack.forEach(st => {
            errorTokens.add(st.index);
            errors.push(`Unmatched ${st.value}`);
        });
        
        let html = "";
        
        for (let i = 0; i < tokens.length; i++) {
            let t = tokens[i];
            if (t.type === 'text') {
                html += t.value.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            } else {
                let val = t.value;
                let isError = errorTokens.has(i);
                
                if (isError) {
                    html += `<span class="chip chip-error" title="Syntax Error"><i class="fas fa-exclamation-triangle chip-icon"></i>${val.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</span>`;
                    continue;
                }
                
                if (val.startsWith('&s') && val.endsWith('-start')) {
                    let speakerNum = val.substring(2, val.indexOf('-start'));
                    html += `<div class="speaker-label">SPEAKER ${speakerNum}:</div>`;
                    continue;
                }
                if (val.startsWith('&s') && val.endsWith('-end')) {
                    continue;
                }
                
                if (val.startsWith('#')) {
                    let m = val.match(/#([a-zA-Z0-9_-]+)(?::[a-zA-Z0-9_-]+)?\[.*?\]\((.*?)\)/);
                    if (m) {
                        html += `<span class="chip chip-bracket" title="Entity: ${m[1]}"><i class="fas fa-location-arrow chip-icon"></i>${m[2]}</span>`;
                    } else {
                        html += val;
                    }
                } else if (val.startsWith('!')) {
                    let m = val.match(/!([a-zA-Z0-9_-]+)\[.*?\]\((.*?)\)/);
                    if (m) {
                        html += `<span class="chip chip-language" title="Language: ${m[1]}"><i class="fas fa-language chip-icon"></i>${m[2]}</span>`;
                    } else {
                        html += val;
                    }
                } else if (val.endsWith('-start') || val.endsWith('-end')) {
                    const cleanTag = val.replace(/&/g, "&amp;").replace(/</g, "&lt;");
                    const catInfo = getTagCategory(val.replace(/-(start|end)$/, '').substring(1));
                    html += `<span class="chip ${catInfo.cls}" title="${catInfo.cat}">${cleanTag}</span>`;
                } else if (val.startsWith('@')) {
                    const catInfo = getTagCategory(val.substring(1));
                    html += `<span class="chip ${catInfo.cls}" title="${catInfo.cat}">${val}</span>`;
                } else {
                    html += val;
                }
            }
        }
        
        return { html, errors };
    }

    function updateNormalizedPreview(id) {
        const textEl = document.getElementById(`text-${id}`);
        const previewEl = document.getElementById(`rich-preview-${id}`);
        const errorEl = document.getElementById(`error-${id}`);
        
        if (textEl && previewEl) {
            const result = processRSML(textEl.value);
            previewEl.innerHTML = result.html;
            
            if (errorEl) {
                if (result.errors.length > 0) {
                    errorEl.style.display = 'block';
                    errorEl.innerHTML = `<i class="fas fa-times" style="margin-right:4px;"></i>${result.errors.length} error(s): ${result.errors.join(', ')}`;
                } else {
                    errorEl.style.display = 'none';
                    errorEl.innerHTML = '';
                }
            }
            
            const labelEl = document.getElementById(`region-text-${id}`);
            if (labelEl) {
                labelEl.textContent = textEl.value;
            }
        }
    }

    function sendSaveEvent() {
      // Send back segments JSON
      sendValue({
        action: 'save',
        segments: currentSegments
      });
    }

    function sendAction(actionName) {
      sendValue({
        action: actionName,
        segments: currentSegments
      });
    }

    // Listen for messages from Streamlit
    window.addEventListener("message", function(event) {
      if (event.data.type === "streamlit:render") {
        const args = event.data.args;
        
        if (args.task_id) {
            document.getElementById('taskTitle').innerText = "Task #" + args.task_id;
        }

        // Initialize once
        if (args.audio_url && (!wavesurfer || wavesurfer.media.src !== args.audio_url)) {
            initWavesurfer(args.audio_url);
        }
        
        // If segments passed from python
        if (args.segments && Array.isArray(args.segments)) {
            currentSegments = args.segments;
            if (audioReady) {
               renderSegments();
            }
        }

        // Set frame height on render
        setFrameHeight(750); // Fixed height for this UI
      }
    });

    // Tell Streamlit we are ready
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:componentReady",
      apiVersion: 1,
    }, "*");

  </script>
</body>
